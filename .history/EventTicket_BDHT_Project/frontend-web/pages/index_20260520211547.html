<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDHT - Kênh bán vé sự kiện hiện đại</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#5f1082', purpleHover: '#4d0b6b',
                            orange: '#f26f21', orangeHover: '#d95a12',
                            darkBg: '#333333'
                        }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css?v=1.3">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8F9FA; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .mini-slider-card { min-width: 280px; width: 280px; }
    </style>
</head>
<body class="text-gray-600 antialiased bg-[#F8F9FA] leading-relaxed">

    <div id="header-container" class="sticky top-0 z-[100] bg-white/80 backdrop-blur-lg border-b border-gray-100 shadow-sm"></div>

    <main class="pb-24">
        <section class="relative w-full overflow-hidden bg-slate-900" style="height: 540px;">
            <div id="hero-slider-track" class="w-full h-full flex transition-transform duration-700 ease-in-out">
                <div class="w-full h-full flex-shrink-0 relative">
                    <img id="banner-img-0" src="https://via.placeholder.com/1920x540?text=Loading+Banner..." class="w-full h-full object-cover opacity-90" alt="Banner 1">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/40 to-transparent flex items-end p-8 md:p-20">
                        <div class="max-w-7xl mx-auto w-full text-white">
                            <span class="bg-gradient-to-r from-orange-500 to-rose-500 text-white font-bold text-[11px] px-4 py-1.5 rounded-full uppercase tracking-widest mb-4 inline-block shadow-lg">HOT LIVE CONCERT</span>
                            <h2 class="text-4xl md:text-6xl font-extrabold mb-4 text-white drop-shadow-md">Liveshow HÀ NHI<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-rose-400">Người Yêu Cũ Là Tri Kỷ</span></h2>
                        </div>
                    </div>
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img id="banner-img-1" src="https://via.placeholder.com/1920x540?text=Loading+Banner..." class="w-full h-full object-cover opacity-90" alt="Banner 2">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/40 to-transparent flex items-end p-8 md:p-20">
                        <div class="max-w-7xl mx-auto w-full text-white">
                            <span class="bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold text-[11px] px-4 py-1.5 rounded-full uppercase tracking-widest mb-4 inline-block shadow-lg">CULTURE EVENT</span>
                            <h2 class="text-4xl md:text-6xl font-extrabold mb-4 text-white drop-shadow-md">À Ố Show<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">Nghệ Thuật Xiếc Tre Việt Nam</span></h2>
                        </div>
                    </div>
                </div>
                <div class="w-full h-full flex-shrink-0 relative">
                    <img id="banner-img-2" src="https://via.placeholder.com/1920x540?text=Loading+Banner..." class="w-full h-full object-cover opacity-90" alt="Banner 3">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/40 to-transparent flex items-end p-8 md:p-20">
                        <div class="max-w-7xl mx-auto w-full text-white">
                            <span class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold text-[11px] px-4 py-1.5 rounded-full uppercase tracking-widest mb-4 inline-block shadow-lg">MUSIC FESTIVAL</span>
                            <h2 class="text-4xl md:text-6xl font-extrabold mb-4 text-white drop-shadow-md">Lễ Hội Âm Nhạc Điện Tử<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">Ravolution EDM 2026</span></h2>
                        </div>
                    </div>
                </div>
            </div>
            
            <button onclick="moveHeroSlide(-1)" class="absolute left-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/30 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-left"></i></button>
            <button onclick="moveHeroSlide(1)" class="absolute right-6 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/30 text-white flex items-center justify-center transition-all z-10"><i class="fas fa-chevron-right"></i></button>
            
            <div id="hero-dots-container" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-3 z-10">
                <span onclick="setHeroSlide(0)" class="w-3 h-3 rounded-full bg-white cursor-pointer transition-all hero-dot active"></span>
                <span onclick="setHeroSlide(1)" class="w-3 h-3 rounded-full bg-white/50 cursor-pointer transition-all hero-dot"></span>
                <span onclick="setHeroSlide(2)" class="w-3 h-3 rounded-full bg-white/50 cursor-pointer transition-all hero-dot"></span>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6 mt-20">
            <div class="flex items-center justify-between mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">SỰ KIỆN MỚI NHẤT</h2>
                <div class="flex gap-2">
                    <button onclick="scrollMiniSlider(-300)" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:bg-brand-purple hover:text-white transition-all"><i class="fas fa-arrow-left"></i></button>
                    <button onclick="scrollMiniSlider(300)" class="w-10 h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 hover:bg-brand-purple hover:text-white transition-all"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
            
            <div class="relative -mx-6 px-6">
                <div id="mini-slider-track" class="flex gap-6 overflow-x-auto pb-8 pt-4 scrollbar-hide scroll-smooth snap-x">
                    <div class="text-center w-full py-10 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br/>Đang tải sự kiện mới...</div>
                </div>
            </div>
        </section>

        <section class="max-w-7xl mx-auto px-6 py-20">
            <div class="flex justify-between items-end mb-10">
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">SỰ KIỆN NỔI BẬT</h2>
                <a href="/pages/events.html" class="text-brand-purple font-semibold hover:underline">Xem tất cả <i class="fas fa-arrow-right text-xs"></i></a>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div id="featured-giant-container" class="lg:col-span-1">
                    <div class="animate-pulse bg-gray-200 h-[400px] rounded-2xl w-full"></div>
                </div>
                
                <div id="featured-grid-container" class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
                     <div class="animate-pulse bg-gray-200 h-[200px] rounded-2xl w-full"></div>
                     <div class="animate-pulse bg-gray-200 h-[200px] rounded-2xl w-full"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-container" class="bg-white border-t border-gray-100 pt-16"></div>

    <script src="../assets/js/core/api-client.js"></script>
    <script src="../assets/js/home.js?v=1.4"></script>
</body>
</html>
